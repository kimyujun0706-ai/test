<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대전장대중학교 안심급식</title>
  <style>
    :root {
      --primary: #3182f6;
      --danger: #f04452;
      --danger-bg: #ffeeee;
      --bg-color: #f2f4f6;
      --card-bg: #ffffff;
      --text-main: #191f28;
      --text-sub: #6b7684;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    }

    body {
      background-color: #e5e8eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 스마트폰 프레임 */
    .phone-frame {
      width: 390px;
      height: 844px;
      background-color: var(--bg-color);
      border-radius: 46px;
      border: 12px solid #22252a;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 상단 노치 디자인 */
    .notch {
      width: 140px;
      height: 26px;
      background-color: #22252a;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    /* 앱 헤더 (로고 강조형) */
    .app-header {
      background-color: var(--card-bg);
      padding: 12px 20px 16px;
      border-bottom: 1px solid #e5e8eb;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-wrap {
      width: 112px;
      margin-bottom: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-wrap img {
      width: 100%;
      height: auto;
      display: block;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .school-badge {
      display: inline-block;
      background-color: #e8f3ff;
      color: var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .app-subtitle {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* 메인 스크롤 영역 */
    .app-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .app-content::-webkit-scrollbar {
      display: none;
    }

    /* 섹션 카드 */
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-desc {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    /* 알러지 19종 토글 그리드 */
    .allergy-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .allergy-btn {
      background-color: #f9fafb;
      border: 1px solid #e5e8eb;
      border-radius: 12px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 600;
      color: #4e5968;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .allergy-btn:hover {
      background-color: #f2f4f6;
    }

    .allergy-btn.active {
      background-color: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
      font-weight: 700;
    }

    .reset-btn {
      font-size: 11px;
      color: var(--text-sub);
      background: none;
      border: none;
      text-decoration: underline;
      cursor: pointer;
    }

    /* 날짜 선택 바 */
    .date-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background-color: #f9fafb;
      padding: 8px 12px;
      border-radius: 12px;
    }

    .date-btn {
      background: none;
      border: none;
      font-size: 16px;
      font-weight: bold;
      color: var(--text-main);
      cursor: pointer;
      padding: 4px 8px;
    }

    .current-date {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* 급식 메뉴 리스트 */
    .meal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meal-item {
      padding: 12px 14px;
      border-radius: 14px;
      background-color: #f9fafb;
      border: 1.5px solid transparent;
      transition: all 0.2s ease;
    }

    /* 알러지 경고 상태 스타일 */
    .meal-item.warning {
      background-color: var(--danger-bg);
      border-color: var(--danger);
    }

    .meal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meal-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }

    .meal-item.warning .meal-name {
      color: var(--danger);
      font-weight: 800;
    }

    .warning-badge {
      background-color: var(--danger);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      display: none;
    }

    .meal-item.warning .warning-badge {
      display: inline-block;
    }

    .meal-allergies {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: #e5e8eb;
      color: #4e5968;
    }

    .tag.matched {
      background-color: var(--danger);
      color: white;
      font-weight: 700;
    }

    .status-msg {
      text-align: center;
      padding: 30px 10px;
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.5;
    }

    .api-notice {
      font-size: 11px;
      color: #8b95a1;
      text-align: center;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>

      </div>
      <div class="header-meta">
        <span class="school-badge">대전광역시교육청 · G10</span>
        <span class="app-subtitle">대전장대중학교 안심급식</span>
      </div>
    </header>

    <main class="app-content">
      <!-- 1. 알러지 필터 섹션 -->
      <section class="card">
        <div class="section-title">
          <span>🚨 내 알러지 선택 (19종)</span>
          <button class="reset-btn" onclick="resetAllergies()">초기화</button>
        </div>
        <p class="section-desc">주의해야 할 성분을 누르면 식단에서 빨간색으로 표시됩니다.</p>
        <div class="allergy-grid" id="allergyGrid"></div>
      </section>

      <!-- 2. 급식 식단표 섹션 -->
      <section class="card">
        <div class="section-title">
          <span>🍱 오늘의 중식 메뉴</span>
        </div>
        <div class="date-bar">
          <button class="date-btn" onclick="changeDate(-1)">◀</button>
          <span class="current-date" id="dateDisplay">2026.11.26 (목)</span>
          <button class="date-btn" onclick="changeDate(1)">▶</button>
        </div>
        
        <ul class="meal-list" id="mealList">
          <li class="status-msg">식단 정보를 불러오는 중입니다...</li>
        </ul>
        <div class="api-notice" id="apiNotice"></div>
      </section>
    </main>
  </div>

  <script>
    // ==========================================
    // [설정 영역] 나이스(NEIS) API 및 학교 기본 정보
    // ==========================================
    const CONFIG = {
      API_KEY: "", // <-- 발급받은 나이스 API 인증키를 여기에 입력하세요.
      ATPT_OFCDC_SC_CODE: "G10",     // 대전광역시교육청
      SD_SCHUL_CODE: "7451044"       // 대전장대중학교
    };

    // 한국 표준 19가지 알러지 유발 식품 데이터
    const ALLERGY_LIST = [
      { id: 1, name: "난류", emoji: "🥚" },
      { id: 2, name: "우유", emoji: "🥛" },
      { id: 3, name: "메밀", emoji: "🌾" },
      { id: 4, name: "땅콩", emoji: "🥜" },
      { id: 5, name: "대두", emoji: "🫘" },
      { id: 6, name: "밀", emoji: "🍞" },
      { id: 7, name: "고등어", emoji: "🐟" },
      { id: 8, name: "게", emoji: "🦀" },
      { id: 9, name: "새우", emoji: "🦐" },
      { id: 10, name: "돼지고기", emoji: "🐷" },
      { id: 11, name: "복숭아", emoji: "🍑" },
      { id: 12, name: "토마토", emoji: "🍅" },
      { id: 13, name: "아황산류", emoji: "🍷" },
      { id: 14, name: "호두", emoji: "🌰" },
      { id: 15, name: "닭고기", emoji: "🐔" },
      { id: 16, name: "쇠고기", emoji: "🐮" },
      { id: 17, name: "오징어", emoji: "🦑" },
      { id: 18, name: "조개류", emoji: "🐚" },
      { id: 19, name: "잣", emoji: "🌲" }
    ];

    // 상태 관리
    let selectedAllergies = new Set();
    let currentDate = new Date();
    let currentMeals = [];

    // 1. 알러지 버튼 렌더링
    function renderAllergyButtons() {
      const grid = document.getElementById("allergyGrid");
      grid.innerHTML = "";

      ALLERGY_LIST.forEach(item => {
        const btn = document.createElement("button");
        btn.className = `allergy-btn ${selectedAllergies.has(item.id) ? "active" : ""}`;
        btn.innerHTML = `<span>${item.emoji}</span><span>${item.id}.${item.name}</span>`;
        
        btn.onclick = () => {
          if (selectedAllergies.has(item.id)) {
            selectedAllergies.delete(item.id);
          } else {
            selectedAllergies.add(item.id);
          }
          renderAllergyButtons();
          renderMealList();
        };
        grid.appendChild(btn);
      });
    }

    function resetAllergies() {
      selectedAllergies.clear();
      renderAllergyButtons();
      renderMealList();
    }

    // 2. 날짜 포맷 및 변경 함수
    function formatDateAPI(date) {
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      return `${yyyy}${mm}${dd}`;
    }

    function formatDateDisplay(date) {
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      return `${yyyy}.${mm}.${dd} (${days[date.getDay()]})`;
    }

    function changeDate(offset) {
      currentDate.setDate(currentDate.getDate() + offset);
      fetchMealData();
    }

    // 3. 나이스 음식 문자열 파싱 (메뉴명과 알러지 번호 분리)
    function parseDishString(rawDish) {
      const regex = /\(([0-9.]+)\)/;
      const match = rawDish.match(regex);
      
      let cleanName = rawDish.replace(regex, "").trim();
      let codes = [];

      if (match && match[1]) {
        codes = match[1]
          .split(".")
          .map(num => parseInt(num, 10))
          .filter(num => !isNaN(num) && num >= 1 && num <= 19);
      }

      return { name: cleanName, codes };
    }

    // 4. 나이스 API 급식 데이터 호출
    async function fetchMealData() {
      document.getElementById("dateDisplay").textContent = formatDateDisplay(currentDate);
      const mealListEl = document.getElementById("mealList");
      const noticeEl = document.getElementById("apiNotice");
      
      mealListEl.innerHTML = `<li class="status-msg">식단 데이터를 조회하고 있습니다...</li>`;

      // API 키가 없는 경우 테스트용 샘플 데이터 출력
      if (!CONFIG.API_KEY) {
        const sampleRaw = "발아현미밥<br/>쇠고기미역국(5.6.16.)<br/>수제등심돈까스(1.2.5.6.10.12.13.)<br/>오징어초무침(5.6.13.17.)<br/>배추김치(9.13.)<br/>요구르트(2.)";
        currentMeals = sampleRaw.split("<br/>").map(parseDishString);
        noticeEl.textContent = "※ 현재 샘플 데이터 모드입니다. 코드 상단 CONFIG.API_KEY를 입력하면 실시간 연동됩니다.";
        renderMealList();
        return;
      }

      const ymd = formatDateAPI(currentDate);
      const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${CONFIG.API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${CONFIG.ATPT_OFCDC_SC_CODE}&SD_SCHUL_CODE=${CONFIG.SD_SCHUL_CODE}&MLSV_YMD=${ymd}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.mealServiceDietInfo) {
          const rawDdish = data.mealServiceDietInfo[1].row[0].DDISH_NM;
          currentMeals = rawDdish.split("<br/>").map(parseDishString);
          noticeEl.textContent = "나이스(NEIS) 교육정보 개방 포털 실시간 연동 중";
          renderMealList();
        } else {
          currentMeals = [];
          mealListEl.innerHTML = `<li class="status-msg">해당 날짜에는 등록된 급식 정보가 없습니다.<br/>(주말, 공휴일 또는 방학)</li>`;
          noticeEl.textContent = "";
        }
      } catch (error) {
        console.error("API 호출 오류:", error);
        mealListEl.innerHTML = `<li class="status-msg">데이터를 불러오는 중 오류가 발생했습니다.<br/>API 인증키와 네트워크 상태를 확인해 주세요.</li>`;
      }
    }

    // 5. 식단 및 알러지 매핑 결과 렌더링
    function renderMealList() {
      const mealListEl = document.getElementById("mealList");
      if (currentMeals.length === 0) return;

      mealListEl.innerHTML = "";

      currentMeals.forEach(meal => {
        const matchedCodes = meal.codes.filter(code => selectedAllergies.has(code));
        const hasWarning = matchedCodes.length > 0;

        const li = document.createElement("li");
        li.className = `meal-item ${hasWarning ? "warning" : ""}`;

        let tagsHtml = "";
        if (meal.codes.length > 0) {
          tagsHtml = `<div class="meal-allergies">` + 
            meal.codes.map(code => {
              const allergyInfo = ALLERGY_LIST.find(a => a.id === code);
              const isMatched = selectedAllergies.has(code);
              const label = allergyInfo ? `${allergyInfo.emoji} ${allergyInfo.name}` : code;
              return `<span class="tag ${isMatched ? "matched" : ""}">${label}</span>`;
            }).join("") + 
          `</div>`;
        }

        li.innerHTML = `
          <div class="meal-header">
            <span class="meal-name">${meal.name}</span>
            <span class="warning-badge">⚠️ 알러지 주의</span>
          </div>
          ${tagsHtml}
        `;

        mealListEl.appendChild(li);
      });
    }

    // 초기 실행
    renderAllergyButtons();
    fetchMealData();
  </script>
</body>
